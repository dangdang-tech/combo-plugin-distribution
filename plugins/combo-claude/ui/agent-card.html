<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Combo Agent</title><style>:root {
  color-scheme: light;
  --bg: #faf9f5;
  --surface: #fff;
  --rail: #f5f0e8;
  --ink: #141413;
  --body: #3d3d3a;
  --muted: #68655f;
  --border: #e6dfd8;
  --primary: #a9583e;
  --success: #2e7d46;
  font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--body);
  background: var(--bg);
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
button,
input,
textarea {
  font: inherit;
}
button,
summary {
  -webkit-tap-highlight-color: transparent;
}
button:focus-visible,
summary:focus-visible,
input:focus-visible,
textarea:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 3px;
}
button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
button {
  cursor: pointer;
}
p,
h1,
h2,
dl {
  margin: 0;
}
h1 {
  font-family: "Noto Serif SC", "Songti SC", "STSong", Georgia, serif;
  font-size: 26px;
  font-weight: 400;
  line-height: 1.4;
  color: var(--ink);
  overflow-wrap: anywhere;
}
h1:focus {
  outline: none;
}
h2 {
  font-family: "Noto Serif SC", "Songti SC", Georgia, serif;
  font-weight: 400;
  font-size: 18px;
  color: var(--ink);
}
.combo-app {
  container-type: inline-size;
  max-width: 800px;
  padding: 24px 32px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
  line-height: 1.55;
  font-size: 14px;
  overflow-wrap: anywhere;
}
.agent-card {
  padding: 26px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  min-width: 0;
}
.identity {
  display: flex;
  gap: 12px;
  justify-content: space-between;
  align-items: flex-start;
}
.badge {
  padding: 3px 8px;
  border-radius: 4px;
  color: var(--primary);
  background: var(--rail);
  font-size: 12px;
  flex-shrink: 0;
}
.badge--shared {
  color: var(--success);
}
.purpose {
  font-size: 15px;
}
.share-summary {
  border-block: 1px solid var(--border);
  padding: 18px 0;
  display: grid;
  gap: 16px;
}
dt {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 4px;
}
dd {
  margin: 0;
}
.disclosure {
  font-size: 13px;
}
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.button {
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink);
  font-size: 13px;
  line-height: 1.5;
  padding: 11px 16px;
  min-height: 44px;
  width: fit-content;
  max-width: 100%;
}
.button:hover:not(:disabled) {
  background: var(--rail);
}
.button--primary {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}
.button--primary:hover:not(:disabled) {
  background: #94492f;
}
.text-button {
  border: 0;
  background: transparent;
  color: var(--primary);
  padding: 0;
  min-height: 32px;
}
.muted,
.source-note,
.connection-note {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
}
.eyebrow {
  color: var(--primary);
  font-size: 11px;
  letter-spacing: 0.07em;
}
.brand {
  font-size: 24px;
  color: var(--ink);
}
.notice,
.sample-banner {
  padding: 12px 14px;
  border-radius: 8px;
  background: var(--rail);
  color: var(--body);
  font-size: 13px;
}
.sample-banner {
  border-left: 3px solid var(--primary);
}
.share-link {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.share-link input {
  width: 100%;
  min-width: 0;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--body);
  font-size: 13px;
}
.content-section {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 18px;
  background: var(--surface);
}
summary {
  cursor: pointer;
  color: var(--ink);
  list-style-position: inside;
}
.section-title {
  display: block;
  font-weight: 600;
}
.section-summary {
  display: block;
  margin-top: 5px;
  font-size: 12px;
  color: var(--muted);
}
.content-file {
  border-top: 1px solid var(--border);
  padding-top: 16px;
  margin-top: 16px;
}
.file-label,
.digest {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 11px;
  color: var(--muted);
  overflow-wrap: anywhere;
}
.readable-content {
  margin: 8px 0 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font: inherit;
  font-size: 13px;
  line-height: 1.65;
}
.trial-entry {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  border-block: 1px solid var(--border);
  padding: 20px 0;
}
.trial-entry h2 {
  margin-bottom: 5px;
}
.files {
  font-size: 12px;
}
.file-entry {
  margin-top: 14px;
  padding: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
}
.digest {
  margin-top: 16px;
}
.starter {
  display: flex;
  flex-direction: column;
  text-align: left;
  gap: 10px;
  padding: 18px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
  color: var(--ink);
  line-height: 1.6;
}
.trial-transcript {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.speaker {
  font-size: 12px;
  color: var(--muted);
}
.speaker--agent {
  color: var(--primary);
}
.trial-text {
  white-space: pre-wrap;
}
.trial-form {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 10px;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  background: var(--surface);
}
textarea {
  width: 100%;
  min-width: 0;
  resize: vertical;
  color: var(--body);
  background: var(--surface);
}
.trial-form textarea {
  border: 0;
  padding: 0;
  line-height: 1.6;
}
.trial-form textarea::placeholder {
  color: var(--muted);
}
.copy-fallback {
  min-height: 100px;
}
.content-section > summary {
  list-style: none;
  position: relative;
  padding-right: 28px;
  min-height: 44px;
}
.content-section > summary::-webkit-details-marker {
  display: none;
}
.content-section > summary::after {
  content: "+";
  position: absolute;
  top: 0;
  right: 0;
  color: var(--muted);
  font-size: 20px;
  font-weight: 400;
}
.content-section[open] > summary::after {
  content: "−";
}
.context-lite {
  --bg: #faf9f6;
  --primary: #a9583e;
  max-width: 736px;
  padding: 28px 24px;
  gap: 20px;
}
.combo-wordmark {
  color: var(--ink);
  font-family: Georgia, "Songti SC", serif;
  font-weight: 900;
  font-size: 31px;
  letter-spacing: -1.5px;
}
.combo-wordmark span {
  color: #cf795c;
}
.context-intro {
  margin-block: 26px 6px;
  text-align: center;
  font-family: "Songti SC", "STSong", Georgia, serif;
  font-size: 29px;
  line-height: 1.5;
  color: var(--ink);
}
.context-card {
  padding: 32px;
  gap: 28px;
  border-radius: 22px;
}
.context-card h1 {
  font-size: 30px;
  line-height: 1.45;
}
.context-identity {
  align-items: center;
  justify-content: flex-start;
  gap: 22px;
}
.context-heading {
  min-width: 0;
}
.agent-mark {
  flex: 0 0 68px;
  width: 68px;
  height: 68px;
  border-radius: 18px;
  background: #f4f0e8;
  display: grid;
  place-content: center;
  gap: 1px;
}
.agent-mark span {
  display: block;
  width: 24px;
  height: 12px;
  border: 2px solid var(--primary);
  border-top: 0;
  transform: rotate(-30deg) skewX(30deg);
  border-radius: 2px;
}
.context-card .purpose {
  margin-top: 6px;
  color: var(--muted);
  line-height: 1.75;
}
.method-preview {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 15px;
}
.method-preview li {
  display: flex;
  align-items: flex-start;
  gap: 20px;
}
.method-number {
  color: var(--primary);
  font-size: 12px;
  flex: 0 0 22px;
  line-height: 1.9;
}
.method-excerpt {
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  white-space: pre-wrap;
  font-size: 15px;
  line-height: 1.75;
}
.context-secondary {
  display: flex;
  gap: 12px;
  justify-content: space-between;
}
.context-secondary .button {
  flex: 1;
  min-height: 44px;
  font-size: 14px;
}
.source-disclaimer {
  text-align: center;
}
.cloud-state {
  display: grid;
  gap: 12px;
}
.context-lite .cloud-state {
  border-bottom: 1px solid var(--border);
  padding-bottom: 20px;
}
.context-lite .cloud-state .muted {
  text-align: center;
}
.context-lite .cloud-state input {
  width: 100%;
  min-width: 0;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
}
.verification-code {
  font-size: 20px;
  letter-spacing: 0.08em;
}
.context-lite .connection-note {
  display: grid;
  gap: 12px;
  background: var(--rail);
  padding: 18px;
  border-radius: 12px;
}
.connection-help > summary {
  padding-block: 10px;
}
.connection-help p {
  margin-bottom: 12px;
}
.readiness-prompt {
  padding: 20px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--surface);
}
.context-card .button--primary {
  min-height: 52px;
  width: 100%;
  font-size: 16px;
  font-weight: 600;
}
.conversation-hint {
  font-size: 12px;
  text-align: center;
  color: var(--muted);
}
.local-state {
  text-align: center;
}
.context-scope {
  font-size: 12px;
  padding-inline: 4px;
  color: var(--muted);
}
.context-scope > summary {
  min-height: 44px;
  padding-block: 12px;
}
.context-scope .share-summary {
  margin-top: 8px;
  line-height: 1.75;
}
.content-header {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 0 4px 8px;
}
.content-header .back-button {
  margin-bottom: 4px;
  padding-inline: 0;
  text-align: left;
}
.context-lite .content-header {
  gap: 18px;
}
.context-lite .content-section {
  border: 0;
  border-bottom: 1px solid var(--border);
  border-radius: 0;
  background: transparent;
  padding: 8px 0 24px;
}
.context-lite .content-file {
  border-top: 0;
}
.back-button::before {
  content: "←";
  margin-right: 8px;
}
.document-content {
  margin-top: 18px;
  font-size: 14px;
  line-height: 1.85;
  overflow-wrap: anywhere;
}
.document-content > * {
  margin: 0;
}
.document-content > * + * {
  margin-top: 14px;
}
.document-content p {
  white-space: pre-wrap;
}
.document-content h3,
.document-content h4,
.document-content h5,
.document-content h6 {
  font-family: inherit;
  color: var(--ink);
  font-size: 15px;
  font-weight: 600;
  line-height: 1.55;
  margin-top: 24px;
}
.document-content h3:first-child {
  margin-top: 0;
}
.document-content h3 {
  font-size: 17px;
}
.document-content ul,
.document-content ol {
  padding-left: 24px;
}
.document-content li + li {
  margin-top: 8px;
}
.document-content li::marker {
  color: var(--muted);
}
.document-content blockquote {
  border-left: 2px solid var(--border);
  padding-left: 16px;
  color: var(--muted);
}
.document-content hr {
  border: 0;
  border-top: 1px solid var(--border);
}
.document-content code,
.raw-content,
.document-content pre {
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
  font-size: 12px;
  line-height: 1.7;
}
.document-content code {
  padding: 2px 4px;
  background: var(--rail);
  border-radius: 4px;
}
.document-content pre,
.raw-content {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  padding: 16px;
  background: #181715;
  color: #faf9f5;
  border-radius: 8px;
}
.document-content pre code {
  background: transparent;
  padding: 0;
}
.document-metadata {
  font-size: 12px;
  color: var(--muted);
}
.document-metadata > summary {
  min-height: 44px;
  padding-block: 10px;
}
.files > summary,
.file-entry > summary {
  min-height: 44px;
  padding-block: 10px;
}
.files > .source-note {
  margin-top: 12px;
}
@media (max-width: 559px) {
  .combo-app {
    padding: 16px;
    gap: 16px;
  }
}
@container (max-width: 559px) {
  .agent-card {
    padding: 18px;
    gap: 16px;
  }
  h1 {
    font-size: 23px;
  }
  .identity {
    gap: 8px;
  }
  .actions {
    flex-direction: column;
  }
  .actions .button {
    width: 100%;
  }
  .content-section {
    padding: 16px;
  }
  .purpose {
    font-size: 14px;
  }
  .context-card {
    padding: 24px 20px;
    gap: 24px;
  }
  .context-card h1 {
    font-size: 24px;
  }
  .context-intro {
    margin-block: 18px 4px;
    font-size: 24px;
  }
  .context-identity {
    flex-direction: column;
    align-items: flex-start;
    gap: 18px;
  }
  .context-secondary {
    flex-direction: column;
    gap: 4px;
  }
  .context-secondary .button {
    width: 100%;
  }
  .method-preview li {
    gap: 14px;
  }
}
@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto;
  }
}
