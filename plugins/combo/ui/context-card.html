.button--primary:hover:not(:disabled) {

}
.trial-entry {

  padding: 20px 0;
}
.trial-entry h2 {
  margin-bottom: 5px;
}
.files {
  font-size: 12px;
}

.digest {
  margin-top: 16px;
}
.starter {

  background: var(--surface);
  color: var(--ink);
  line-height: 1.6;
}
.trial-transcript {

  flex-direction: column;
  gap: 12px;
}
.speaker {

}
.speaker--agent {

}
.trial-text {

}
.trial-form {

textarea {

}

}

}
.copy-fallback {

}

  position: relative;
  padding-right: 28px;
  min-height: 44px;
}

  display: none;
}
.content-section > summary::after {
  content: "+";

  right: 0;

}
.document-content p {

}
.document-content h3,
.document-content h4,
.document-content h5,
.document-content h6 {

}

.document-content h3 {

}

}

}

.document-content pre,

.document-metadata {

    width: 100%;
  }
  .method-preview li {
    gap: 14px;
  }
}
@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto;
  }
